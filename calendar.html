<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>カレンダー - 解体案件管理</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1565C0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <h1>カレンダー</h1>
  </header>

  <div class="main-content">
    <div class="cal-nav">
      <button type="button" class="cal-nav-btn" id="cal-prev">‹</button>
      <div class="cal-month-label" id="cal-month-label"></div>
      <button type="button" class="cal-nav-btn" id="cal-next">›</button>
    </div>
    <button type="button" class="cal-today-btn" id="cal-today">今月に戻る</button>

    <div class="cal-legend" id="cal-legend"></div>

    <div class="cal-grid" id="cal-grid">
      <div class="loading"><div class="loading-spinner"></div></div>
    </div>

    <div class="cal-day-detail" id="cal-day-detail"></div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
